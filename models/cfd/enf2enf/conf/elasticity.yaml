data:
  data_dir: /public/share/sugonhpcapp01/onestore/onedatasets/CFD_Benchmark/elasticity/Meshes/
  xy_file: Random_UnitCell_XY_10.npy
  sigma_file: Random_UnitCell_sigma_10.npy
  split_ratio: 0.8
  seed: 42
model:
  n_lat: 9
  l_dim: 8
  coord_dim: 2
  width_enc: 128
  width_dec: 256
  heads: 2
  sigma_window: 0.1
  rff_d_enc: 128
  rff_d_dec: 256
  rff_sigma_enc: 2
  rff_sigma_dec: 10
  latent_bbox:
  - -0.75
  - 0.75
  attention_blocks: 2
  inner_steps_K: 3
  inner_lr_lambda_c: 0.5
  train_rff: false
  use_global_params: false
  share_input_decoder: true
train:
  lr_lambda_theta: 0.0001
  optimizer: adam
  batch_size: 4
  epochs_encoder: 1500
  epochs_decoder: 2500
  weight_decay: 0.0
  scheduler: null
  grad_clip: null
  device: cuda
  output_dir: /public/home/wangqi_scnet/auto_run_test/v5.5/outputs/enf2enf/runs/elasticity
  checkpoint_encoder: encoder.pth
  checkpoint_decoder: decoder.pth
  load_normalization_from_train: true
eval:
  metrics:
  - l2_relative_error
  output_file: metrics.json
