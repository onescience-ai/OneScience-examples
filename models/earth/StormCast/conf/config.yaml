project:
  name: stormcast
  seed: 42
  output_dir: ./outputs

data:
  root_dir: ./data
  train_years: [2019]
  val_years: [2021]
  test_years: [2022]
  time_step_hours: 1
  input_steps: 1
  output_steps: 1
  era5_image_size: [721, 1440]
  image_size: [512, 640]
  num_timesteps: 4
  normalize: true
  era5_variables:
