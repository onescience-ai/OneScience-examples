  invariant_variables: [lsm, orography]

dataloader:
  batch_size: 1
  num_workers: 0
  pin_memory: true

model:
  regression_conditions: [state, background, invariant]
  diffusion_conditions: [state, regression, invariant]
  image_size: [512, 640]
  model_channels: 128
  channel_mult: [1, 2, 2, 2, 2]
  num_blocks: 4
  attention_resolutions: []
  regression_weights: ./data/checkpoint/regression/model_bak.pt
  diffusion_weights: ./data/checkpoint/diffusion/model_bak.pt

training:
  stage: regression
  from_scratch: true
  initial_weights: null
  resume_checkpoint: null
  regression_weights: ./data/checkpoint/regression/model_bak.pt
  epochs: 10
  max_steps: 10
  learning_rate: 0.0002
  betas: [0.9, 0.999]
  weight_decay: 0.0
  gradient_clip_norm: null
  checkpoint_interval: 1
  log_interval: 1
  sigma_data: 0.5
  P_mean: -1.2
  P_std: 1.2
  checkpoint_dir: ./data/checkpoint

inference:
  split: test
  num_steps: 1
  diffusion_steps: 18
  sigma_min: 0.002
  sigma_max: 800.0
  rho: 7.0
  output_dir: ./outputs/inference
  plot_state_variable: refc
  plot_background_variable: t2m
